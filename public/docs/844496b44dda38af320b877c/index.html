<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>현장대장 업무 플로우 리서치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F5F5F1; --surface:#FFFFFF; --soft:#ECECE7; --line:#D9D9D2; --line-strong:#25292D;
  --text:#25292D; --muted:#6B7178; --marker:#F0B429; --marker-soft:#FBEFD2; --marker-text:#25292D;
  --grid:rgba(37,41,45,.045); --code:#ECECE7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181A; --surface:#1E2124; --soft:#272B2F; --line:#343A40; --line-strong:#D9DCDF;
    --text:#E4E6E8; --muted:#9BA2A9; --marker:#F0B429; --marker-soft:#3A2F14; --marker-text:#F6D98A;
    --grid:rgba(228,230,232,.035); --code:#272B2F;
  }
}
:root[data-theme="dark"]{
  --bg:#16181A; --surface:#1E2124; --soft:#272B2F; --line:#343A40; --line-strong:#D9DCDF;
  --text:#E4E6E8; --muted:#9BA2A9; --marker:#F0B429; --marker-soft:#3A2F14; --marker-text:#F6D98A;
  --grid:rgba(228,230,232,.035); --code:#272B2F;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--text);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:15.5px;line-height:1.72;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1240px;margin:0 auto;gap:40px;padding:0 28px}
nav.toc{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:36px 0 40px}
.toc .label{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--line)}
.toc a{display:block;padding:5px 0 5px 14px;margin-left:-1px;border-left:2px solid transparent;color:var(--muted);text-decoration:none;font-size:13px;line-height:1.4}
.toc a:hover{color:var(--text)}
.toc a.on{color:var(--text);border-left-color:var(--line-strong);font-weight:600}
.toc a:focus-visible{outline:2px solid var(--line-strong);outline-offset:2px}
main{padding:36px 0 96px;min-width:0}
.doc{background:var(--surface);border:1px solid var(--line);padding:48px 56px 64px;max-width:860px}
.sheet-head{display:flex;justify-content:space-between;gap:16px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line-strong);padding-bottom:10px;margin-bottom:28px}
.doc h1{font-size:30px;line-height:1.3;font-weight:700;letter-spacing:-.015em;margin:0 0 20px;text-wrap:balance}
.doc h2{font-size:21px;line-height:1.35;font-weight:700;margin:56px 0 16px;padding-top:18px;border-top:1px solid var(--line);text-wrap:balance}
.doc h3{font-size:17px;line-height:1.45;font-weight:600;margin:34px 0 10px;text-wrap:balance}
.doc h4{font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:24px 0 6px}
.doc p,.doc li{max-width:68ch}
.doc p{margin:0 0 14px}
.doc ul,.doc ol{margin:0 0 16px;padding-left:22px}
.doc li{margin:3px 0}
.doc strong{font-weight:600}
.doc hr{display:none}
.doc a{color:var(--text);text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:3px;word-break:break-all}
.doc code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.86em;background:var(--code);padding:1px 5px;border-radius:2px}
.doc pre{background:var(--soft);border:1px solid var(--line);padding:16px 18px;overflow-x:auto;margin:0 0 18px}
.doc pre code{background:none;padding:0;font-size:12.5px;line-height:1.7;white-space:pre}
.doc blockquote{margin:0 0 18px;padding:12px 16px;border-left:2px solid var(--line-strong);background:var(--soft)}
.doc blockquote p{margin:0}
.doc blockquote p+p{margin-top:6px}
.tbl{overflow-x:auto;margin:0 0 20px;border:1px solid var(--line)}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.55}
.doc th,.doc td{padding:9px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:top;min-width:92px}
.doc th:last-child,.doc td:last-child{border-right:0}
.doc tr:last-child td{border-bottom:0}
.doc th{background:var(--soft);font-weight:600;font-size:12.5px;white-space:nowrap}
.ev{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;line-height:1;padding:4px 7px 3px;border:1px solid var(--line-strong);border-radius:2px;vertical-align:1px;white-space:nowrap;color:var(--text);background:transparent}
.ev-확인{background:var(--marker-soft);border-color:var(--marker);color:var(--marker-text)}
.ev-가설{border-style:dashed}
.ev-미확인{border-color:var(--muted);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--muted);margin:0 0 28px;padding:12px 14px;border:1px solid var(--line);background:var(--bg)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.menu{display:none}
@media (max-width:960px){
  .shell{grid-template-columns:1fr;gap:0;padding:0 14px}
  nav.toc{position:static;max-height:none;padding:20px 0 0}
  nav.toc ol{display:none}
  nav.toc.open ol{display:flex}
  .menu{display:inline-block;font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);cursor:pointer}
  .toc .label{display:none}
  main{padding-top:14px}
  .doc{padding:28px 20px 40px}
  .doc h1{font-size:24px}
}
</style>
</head>

<script>
const MD = "# 서울 아파트 인테리어 업체의 상담부터 사후관리까지 업무 플로우 리서치\n\n- 작성일: 2026-09-22 (Asia/Seoul)\n- 상태: **조사 초안·제안 — 승인 전 / 현장 관찰 전**\n- 조사 목적: 현장대장·집보다의 실사용 검증을 위한 인테리어 업체 업무·역할·데이터·병목 구조 정리\n- 조사 범위: 서울 아파트 세대 내부 공사를 하는 1인·소규모 인테리어 업체(D-027·D-050·D-051)\n- 형식 참고: Petnow for shelters 「미국 동물보호소·레스큐의 구조부터 입양까지 업무 플로우 딥리서치」(2026-07-25)의 목차·근거 수준 표기·관찰 프레임\n- 상위 문서: [개발 기준](../development-baseline.md), [데이터 구조 제안](../architecture/data-model.md), [신뢰·후기 기준](trust-and-reviews.md)\n\n> 이 문서의 단계·병목·제품 가설은 **제안**이다. 문서 관리 규칙에 따라 `확정`은 D-ID가 있는 사용자 결정만 가리킨다.\n> 이 문서는 새 결정을 만들지 않는다. 채택하려면 해당 항목을 인터뷰로 확인하고 새 D-ID로 기록한다.\n\n---\n\n## 한 줄 결론\n\n**인테리어 현장 운영의 핵심은 공정표가 아니라, 집 한 채의 공사 상태를 대표·기술자·고객·관리사무소가 끊김 없이 이어받고 막힌 일을 다음 행동으로 연결하는 과정이다.**\n\n---\n\n## 이 문서 사용법\n\n- **처음 읽는다면**: 섹션 1(핵심 인사이트) 6개만 읽어도 F-M2-WORKSPACE 설계 전 맥락을 파악할 수 있다\n- **업체 인터뷰를 준비한다면**: 섹션 11~12(관찰 프레임·질문 목록)로 바로 이동\n- **특정 업무를 찾는다면**: 섹션 4의 단계별 상세 플로우(4.1~4.7)\n- **근거를 확인한다면**: 섹션 14~15. 법령·공공기관 자료 외의 업무 흐름은 업계 통념과 현재 설계를 종합한 가설이며, 발생률·소요시간은 관찰로 검증해야 한다\n\n---\n\n## 1. 현장대장이 먼저 가져갈 핵심 인사이트\n\n`근거 수준`은 섹션 14 기준을 따른다. **[확인]** 법령·공공기관 자료로 뒷받침, **[종합]** 복수 자료와 현재 설계 기록을 종합한 판단, **[가설]** 현장대장 제품 관점의 초기 가설, **[미확인]** 공개자료로 알 수 없음.\n\n### 인사이트 1. 기본 단위는 공정 단계가 아니라 `집·공사 사건·상태 변화`다\n\n**근거 수준: [종합]**\n\n같은 세대가 몇 년 뒤 부분 공사를 다시 하거나, 준공 후 하자보수를 요청할 수 있다. 공사 사건(현장)과 공사 대상(집·고객)을 나누지 않으면 과거 시공 범위, 사용 자재, 사진, 보수 이력이 끊긴다. 쉘터 문서가 `Animal ID`와 `Intake Event`를 분리한 것과 같은 이유다.\n\n**현재 구현 확인**: `verified_projects.status`는 `active`·`completed`·`archived` 세 값이고, 공정(`verified_schedules`)은 `planned`·`active`·`completed`다. 공정 변경은 이벤트로 버전 관리되지만 현장 전체의 병렬 상태, 막힌 이유, 하자보수 사건은 표현하지 않는다.\n\n**→ 함의**: 현장 화면에 진행 단계 하나를 보여주기보다 공정·단지 절차·자재·고객 결정·인계 상태를 따로 볼 수 있는지 검증한다. 하자보수를 원래 현장에 이어 붙이는 사건으로 둘지 검토한다.\n\n### 인사이트 2. 현장 운영은 정상 기록보다 `예외·미결정·다음 행동`을 처리하는 일이다\n\n**근거 수준: [종합]** 발생 빈도는 미확인.\n\n정상 공정은 일정대로 흘러간다. 대표가 시간을 쓰는 지점은 자재 미입고, 고객의 타일·색상 미결정, 기술자 일정 충돌, 철거 후 발견된 누수·배관 문제, 관리사무소 동의 대기처럼 다음 공정을 막는 예외다. 쉘터의 Population Rounds(동물별 차단 사유·담당·기한을 매일 검토하는 회의)에 해당하는 일을 대표 한 명이 머릿속과 메신저로 하고 있을 가능성이 높다.\n\n**→ 함의**: 모든 기록을 자세히 입력하게 하기보다 정상 공정은 한 번에 완료하고, 지연·변경·미결정만 대표와 고객에게 올리는 구조를 우선 검증한다. D-020의 \"일정 변경 알림 발송 조건 미정\"을 이 원칙으로 채울 수 있는지 확인한다.\n\n### 인사이트 3. 협력 기술자 관리는 여러 공종의 일정·기록·연락을 조율하는 업무다\n\n**근거 수준: [종합]** 조직별 연락량·누락률은 미확인.\n\n대표 1인 업체(D-027)라도 현장에는 철거·설비·목공·전기·타일·도장·도배·가구 기술자가 차례로 들어온다. 이들은 계정을 가진 직원이 아니라 공종별로 부르는 외부 인력인 경우가 많다. 쉘터의 임보자처럼 흩어진 사람에게 오늘 할 일을 알리고, 완료 사진과 이상을 받아야 한다.\n\n**현재 결정과의 관계**: 멤버 추가·초대는 현재 범위에서 제외(D-028)되고 담당자 변경 기능은 필요하지 않다(D-019). 계정 없는 링크 기록은 멤버 기능과 다를 수 있으나, 채택 여부는 사용자 결정이 필요하다.\n\n**→ 함의**: 기술자가 계정 없이 링크로 완료 사진과 이상만 남기고, 대표가 미응답·이상을 확인하는 흐름이 실제 병목인지 먼저 관찰한다.\n\n### 인사이트 4. 공사 지연은 착공보다 `선행조건과 인계`에서 발생한다\n\n**근거 수준: [확인] 선행조건의 존재 / [종합] 지연 구조**\n\n공동주택 세대 내부의 마감재 교체, 창틀·문틀 교체, 배관 교체 같은 공사도 관리주체(관리사무소)의 동의를 받아야 하고, 비내력벽 철거 같은 행위는 시장·군수·구청장의 허가나 신고 대상이다(공동주택관리법 시행령, 찾기쉬운 생활법령정보). 착공 전 이 절차, 고객의 자재 선택, 자재 발주, 기술자 일정이 모두 맞아야 첫 공정이 시작된다. 준공 시에도 보수 목록, 잔금, 보증 안내, 자재 정보가 함께 정리되어야 한다.\n\n**→ 함의**: 견적서 기능보다 현장별 착공 준비 조건·막힌 이유·기한과, 준공 인계 조건의 연결을 우선 검증한다. 돈 관리는 견적서 관리까지라는 결정(D-022·D-023)은 유지하고, 잔금은 상태 표시만 검토한다.\n\n### 인사이트 5. 사진·AI 기능은 독립 기능보다 기록 흐름에 내장될 때 가치가 명확하다\n\n**근거 수준: [가설]**\n\n같은 사진이 공정 기록, 고객 진행 공유(D-021), 집보다 시공사례(D-014)로 재사용된다. 현재 설계도 원본 사진 보관과 사례 공개 사진 선택을 분리한다(`case_original_photos`·`case_publication_photos`). 쉘터 문서가 비문 인식을 Intake 업무의 보조 기능으로 둔 것처럼, 사진 분류·설명 초안 같은 기능은 공정 완료 기록 안에 넣어야 쓰인다.\n\n**→ 함의**: 사진 기능을 판매 메시지로 내세우기보다 \"공정 기록 한 번으로 고객 공유와 사례 초안이 생긴다\"는 흐름을 검증한다.\n\n### 인사이트 6. 업체 규모·공사 유형별 문제를 분리해야 한다\n\n**근거 수준: [확인] 등록 기준 / [종합] 흐름 차이**\n\n공사 예정금액 1,500만원 미만은 건설산업기본법상 경미한 건설공사로 건설업 등록 없이 시공할 수 있고, 그 이상은 실내건축공사업 등록이 필요하다. 한국소비자원이 2018~2021년 접수한 인테리어 피해구제 1,752건 중 1,500만원 미만 공사가 77.1%였다(보도 인용). 부분 시공 위주의 1인 업체와 전체 리모델링을 하는 등록 업체는 공정 수, 협력 인력, 계약 방식이 다를 가능성이 높다.\n\n**→ 함의**: 인터뷰 증거를 `업체 공통 업무`와 `전체 리모델링 특수 업무`로 나눠 기록하고, 일반화는 서로 다른 유형의 업체 3곳 이상에서 확인한다.\n\n---\n\n## 2. 한눈에 보는 상담부터 사후관리까지의 흐름\n\n인테리어 업무는 `상담 → 계약 → 시공 → 준공`으로 끝나는 직선형 절차가 아니다. 현장이 어느 공정에 있는지보다, 단지 절차·고객 결정·자재·기술자 일정 중 무엇이 끝났고 무엇이 다음 공정을 막는지가 중요하다.\n\n### 7개 거시 단계\n\n| 단계 | 핵심 질문 | 주요 업무 | 관여 이해관계자 | 다음 단계로 넘어가는 조건 |\n| --- | --- | --- | --- | --- |\n| **1. 문의·상담 요청** | 이 공사를 받을 수 있는가 | 문의 접수, 희망 시기·범위·예산 확인, 방문 전 대략 비용·일정·유사 사례 답변 | 대표, 고객, 집보다 운영자 | 고객의 상담 업체 선택과 연락처 공개(D-038) |\n| **2. 실측·방문 상담** | 실제 현장 조건은 무엇인가 | 방문 예약, 실측, 기존 상태 사진, 구조·배관·확장 여부 확인 | 대표, 고객 | 공사 범위와 현장 조건 확정 |\n| **3. 견적·계약** | 무엇을 얼마에 언제까지 하는가 | 견적 작성·수정, 버전 비교, 계약서·특약, 계약금 | 대표, 고객 | 계약 성사 기록과 현장 연결(D-055·D-066) |\n| **4. 착공 준비** | 첫 공정을 시작해도 되는가 | 관리사무소 동의·신고, 이웃 세대 안내, 엘리베이터 사용·보양, 자재 선택·발주, 기술자 일정 | 대표, 고객, 관리사무소, 자재 거래처, 기술자 | 착공 선행조건 완료와 공정표 확정 |\n| **5. 시공** | 오늘 누가 무엇을 해야 하는가 | 공종별 작업, 완료 사진, 추가·변경 공사 협의, 고객 진행 공유 | 대표, 기술자, 고객 | 공정별 완료와 변경 사항 반영 |\n| **6. 준공 점검·인계** | 고객에게 무엇을 넘겨야 하는가 | 고객 점검, 보수 목록 처리, 잔금, 사용 자재·보증·관리 방법 안내, 청소 | 대표, 고객, 기술자 | 보수 완료, 인계 확인, 현장 완료 |\n| **7. 사후관리·사례 공개** | 공사가 유지되도록 무엇을 지원하는가 | 정해진 시점의 점검 연락, 하자보수, 후기 요청, 시공사례 공개 | 대표, 고객, 기술자, 집보다 운영자 | 보증기간 경과, 하자보수 완료, 사례 공개 또는 보류 |\n\n### 전체 흐름에서 계속 병렬로 움직이는 상태\n\n```text\n문의·상담 → 실측·방문 → 견적·계약 → 착공 준비 → 시공 → 준공 점검·인계 → 사후관리·사례 공개\n                    ├─ 계약 상태: 견적 버전·계약 성사·추가 공사 합의\n                    ├─ 단지 절차: 관리사무소 동의·행위허가/신고·이웃 안내·엘리베이터 보양\n                    ├─ 공정 상태: 공종별 예정·진행·완료·지연\n                    ├─ 자재 상태: 고객 선택 대기·발주·입고·불량\n                    ├─ 고객 결정: 선택 대기 항목·변경 요청·점검 의견\n                    └─ 진행 상태: 다음 행동·막힌 이유·기한\n```\n\n> **적용 범위**: 위 흐름은 서울 아파트 세대 내부 공사의 대표 모델이다. 부분 시공(욕실·주방·도배만), 전체 리모델링, 확장·비내력벽 철거가 포함된 공사, 단지 관리규약에 따라 실제 단계와 순서는 달라진다.\n\n---\n\n## 3. 업체 유형별 플로우 차이\n\n| 구분 | 1인 부분 시공 업체 | 소규모 종합 업체 | 등록 실내건축공사업체 |\n| --- | --- | --- | --- |\n| 주요 공사 | 욕실·주방·도배·바닥 등 단일 공종 | 여러 공종 묶음, 부분·전체 리모델링 | 전체 리모델링, 1,500만원 이상 공사 |\n| 등록 요건 | 경미한 공사 범위 [확인] | 공사금액에 따라 다름 [확인] | 실내건축공사업 등록 [확인] |\n| 협력 인력 | 대표가 직접 시공하거나 1~2명 | 공종별 기술자 여러 팀 | 공종별 협력업체와 현장 관리자 |\n| 운영 리듬 | 짧은 공기, 동시 현장 다수 | 수주 영업과 현장 관리 병행 | 공정표 기반 관리, 서류 비중 큼 |\n| 핵심 도구 [가설] | 전화·메신저·사진첩 | 메신저·엑셀 견적·공정표 | 견적 프로그램·공정표·계약 서류 |\n| 주요 병목 [가설] | 문의 응대와 시공의 시간 충돌 | 기술자 일정·자재·고객 결정 조율 | 서류·변경 관리·하자 대응 |\n\n### 해석\n\n- **[종합]** 같은 \"인테리어 업체\"라도 1인 부분 시공과 전체 리모델링 업체의 핵심 업무가 다르다.\n- **[가설]** 현장대장의 초기 사용자(D-027 대표 1인)는 소규모 종합 업체의 조율 문제와 가장 가깝다. 인터뷰로 확인한다.\n\n---\n\n## 4. 단계별 상세 업무 플로우\n\n각 절은 `실제 업무 → 생성 데이터 → 대표 병목 → 현장대장 관점` 순서다. 병목은 모두 **[가설]**이며 섹션 11의 관찰로 검증한다.\n\n### 4.1 문의·상담 요청\n\n#### 유입 경로\n\n- 집보다 상담 요청(서비스 추천 최대 3곳, 고객 직접 선택 별도 집계, D-035·D-036)\n- 지인 소개, 기존 고객 재문의, 온라인 커뮤니티, 매장 방문, 전화\n\n#### 실제 업무\n\n- 희망 공사 시기·위치·범위·예산 확인\n- 방문 전 대략 비용·가능 일정·유사 시공사례로 답변(D-013)\n- 동시에 받는 여러 문의 중 받을 공사 선별\n\n#### 생성 데이터\n\n- 상담 요청, 답변 버전, 연락처 공개 이력, 대화(구현: `customer_consultation_requests`, `consultation_previsit_answers`, `consultation_contact_grants`, `consultation_messages`)\n\n#### 대표 병목\n\n- 시공 중에 문의가 들어와 응답이 늦어짐\n- 집보다 밖 문의(전화·메신저)는 기록이 남지 않음\n\n#### 현장대장 관점\n\n- 상담 흐름은 이미 구현 범위가 넓다. 서비스 밖 문의를 현장대장에 적을 필요가 있는지는 관찰로 확인한다.\n\n---\n\n### 4.2 실측·방문 상담\n\n#### 실제 업무\n\n- 방문 일정 조율(구현: `consultation_visits`)\n- 실측, 기존 상태 사진, 창호·배관·전기·확장 여부 확인\n- 구조 변경이 필요한지 판단(섹션 8)\n\n#### 생성 데이터\n\n- 실측 치수, 공사 전 사진, 현장 조건 메모\n\n#### 대표 병목\n\n- 실측 사진·치수가 개인 사진첩과 메모에 흩어짐\n- 공사 전 사진이 나중에 사례 공개용 \"전\" 사진으로 쓰일 줄 모르고 찍힘\n\n#### 현장대장 관점\n\n- 방문 기록과 공사 전 사진을 계약 후 현장에 그대로 이어 붙인다(D-066 연결 시점).\n\n---\n\n### 4.3 견적·계약\n\n#### 실제 업무\n\n- 견적 직접 작성·수정 또는 기존 엑셀·PDF 업로드(D-026)\n- 견적 버전 비교와 조정\n- 계약서 작성. 공정거래위원회 「실내건축·창호공사 표준계약서」 사용이 권장된다 [확인]\n- 계약 성사 기록과 현장 생성·연결(D-055·D-066)\n\n#### 생성 데이터\n\n- 견적 버전·항목·파일(구현: `verified_estimates`, `verified_files`), 계약 성사 기록(`consultation_outcomes`), 현장 연결(`consultation_project_links`)\n\n#### 대표 병목\n\n- 최종 합의 견적이 어느 버전인지 헷갈림\n- 계약 후 추가·변경 공사가 구두로만 합의됨\n\n#### 현장대장 관점\n\n- 계약 후 변경을 \"견적 새 버전\"으로 남길지, 별도 변경 기록으로 남길지 결정이 필요하다. 금액 정산은 범위 밖이다(D-023).\n\n---\n\n### 4.4 착공 준비\n\n#### 착공 선행조건\n\n| 조건 | 내용 | 근거 |\n| --- | --- | --- |\n| 관리주체 동의 | 마감재·창틀·배관 교체 등 경미한 공사도 관리사무소 동의 필요 | [확인] 공동주택관리법 시행령 |\n| 행위허가·신고 | 비내력벽 철거, 대수선 등은 시·군·구 허가 또는 신고 | [확인] 공동주택관리법 시행령 |\n| 이웃 세대 안내·동의 | 소음 공사 전 안내문 또는 동의서 | [종합] 단지 관리규약마다 다름 |\n| 엘리베이터 사용·보양 | 자재 반입·폐기물 반출 일정 신청 | [종합] 단지마다 다름 |\n| 고객 자재 선택 | 타일·바닥재·도배지·조명·수전 등 | [종합] |\n| 자재 발주·입고 일정 | 공정 시작일 전 입고 | [종합] |\n| 기술자 일정 | 공종 순서대로 확보 | [종합] |\n\n#### 대표 병목\n\n- 고객의 자재 결정이 늦어 발주가 밀림\n- 관리사무소 동의·이웃 안내가 착공 직전에 처리됨\n- 공종 하나의 일정이 밀리면 뒤 공종 전부를 다시 연락함\n\n#### 현장대장 관점\n\n- 착공 준비 체크리스트를 현장마다 두고, 막힌 조건과 기한을 보여준다.\n- 고객이 결정해야 할 항목을 진행 공유 링크(D-021)에서 보이게 할지 검토한다.\n\n---\n\n### 4.5 시공\n\n#### 하루 반복 업무\n\n- 기술자 출입 확인, 공종별 작업\n- 완료·중간 사진\n- 고객 진행 공유와 질문 응답\n- 추가·변경 공사 협의\n- 자재 부족·불량 대응\n- 폐기물 반출, 공용부 보양 확인\n\n#### 생성 데이터\n\n- 공정 변경 이력과 알림(구현: `verified_schedule_events`, `verified_schedule_notifications`)\n- 공정 사진, 변경 합의, 이상 기록\n\n#### 대표 병목\n\n- 철거 후 누수·배관·단열 문제가 발견되어 공정과 비용이 바뀜\n- 기술자 완료 보고가 사진 한 장 또는 말로만 옴\n- 고객이 진행 상황을 계속 물어봄\n\n#### 현장대장 관점\n\n- 정상 공정은 한 번에 완료, 지연·변경·발견 사항만 상세 기록\n- 공정 변경 알림(D-024·D-025)의 발송 조건을 \"고객에게 영향이 있는 변경\"으로 정의할 수 있는지 검증\n\n---\n\n### 4.6 준공 점검·인계\n\n#### 준공 전 체크\n\n- 고객 동행 점검, 보수 목록 작성·처리\n- 청소, 공용부 원상 복구\n- 잔금(공사대금 결제는 사업자·고객이 직접 처리, D-023)\n\n#### 인계 묶음\n\n- 사용 자재 목록(품번·색상·구매처)\n- 공종별 시공 범위와 보증 기간. 건설산업기본법 시행령상 실내건축 하자담보책임기간은 1년 [확인]\n- 관리 방법, 하자 발생 시 연락 방법\n- 공사 전·후 사진\n\n#### 대표 병목\n\n- 보수 목록이 메신저 대화에 묻힘\n- 자재 정보를 나중에 다시 찾기 어려움\n\n#### 현장대장 관점\n\n- 인계 묶음을 공유 링크의 선택 항목(`selected_shares`)으로 만들 수 있는지 검토한다.\n\n---\n\n### 4.7 사후관리·하자보수·사례 공개\n\n#### 권장 후속 연락 [가설]\n\n| 시점 | 목적 |\n| --- | --- |\n| 준공 1주 | 사용 중 불편·초기 하자 |\n| 준공 1개월 | 마감·실리콘·줄눈 상태, 후기 요청 |\n| 첫 겨울 | 결로·단열·난방 관련 확인 |\n| 보증기간 만료 전 | 하자 최종 확인 |\n\n쉘터 문서의 입양 후 2일·10일·약 6주 연락과 같은 구조다. 시점은 인터뷰로 정한다.\n\n#### 대표 병목\n\n- 한국소비자원 인테리어 피해구제 유형 1위는 `하자보수 미이행·지연` 24.5%(2018~2021, 보도 인용) [확인]\n- 하자보수 요청이 원래 공사 기록과 연결되지 않음\n\n#### 현장대장 관점\n\n- 하자보수를 원래 현장에 이어지는 사건으로 기록하면 온도 지표(D-044)와 시공 후기(D-047·D-048)의 근거 데이터가 된다.\n- 준공 사진에서 시공사례 초안을 만들고, 공개는 사업자가 권한 확인 후 직접 한다(D-040·D-041).\n\n---\n\n## 5. 전체 업무를 움직이는 병렬 상태축\n\n### 단일 상태 필드로 표현하기 어려운 이유\n\n현장 하나는 동시에 다음 상태를 가질 수 있다.\n\n| 상태축 | 상태 예시 | 현재 구현 |\n| --- | --- | --- |\n| 계약 | 견적 협의, 계약 성사, 추가 공사 합의 대기 | 견적 버전·계약 성사 기록 있음 |\n| 단지 절차 | 관리사무소 동의 대기, 신고 완료, 이웃 안내 완료 | 없음 |\n| 공정 | 목공 진행, 타일 지연, 도배 예정 | 공정별 3단계 상태 |\n| 자재 | 고객 선택 대기, 발주, 입고, 불량 교환 | 없음 |\n| 고객 결정 | 조명 선택 대기, 변경 요청 검토 | 없음 |\n| 인계 | 보수 목록 3건 남음, 인계 완료 | 없음 |\n| 사례 공개 | 비공개, 초안, 공개, 철회 | 있음 |\n| 다음 행동 | 담당, 기한, 막힌 이유 | 없음 |\n\n### 권장 데이터 구조 — 제안\n\n| 쉘터 문서 구조 | 현장대장 대응 | 상태 |\n| --- | --- | --- |\n| Animal | 집·고객(공사 대상) | 미정. 동호수 필수화는 하지 않음 |\n| Intake Event | 현장(공사 사건) | `verified_projects` 있음 |\n| Custody/Legal Status Event | 단지 절차 이벤트 | 신규 제안 |\n| Location Event | 해당 없음 | — |\n| Medical Event | 발견 사항·변경 공사 이벤트 | 신규 제안 |\n| Care Task/Event | 공정·작업 완료 기록 | `verified_schedules`·이벤트 있음 |\n| Pathway Plan | 착공 준비·준공 인계 체크리스트와 막힌 이유 | 신규 제안 |\n| Person/Organization Role | 고객, 기술자, 관리사무소, 자재 거래처 | 고객만 있음. 기술자는 D-028과 함께 결정 |\n| Application/Adoption Case | 상담 요청·선택·방문·성사 | 구현됨 |\n| Financial Transaction | 범위 밖(D-022·D-023) | 채택하지 않음 |\n| Communication | 상담 대화 | 상담 단계만 있음 |\n| Document | 견적 파일, 계약서, 인계 묶음 | 견적 파일만 있음 |\n\n---\n\n## 6. 역할별 실제 업무와 정보 요구\n\n| 역할 | 반복 업무 | 즉시 필요한 정보 | 주된 기록 |\n| --- | --- | --- | --- |\n| 대표 | 영업·견적·일정·자재·고객 응대·현장 확인 | 오늘 막힌 현장, 기한, 고객 미결정 항목 | 견적·공정·변경·사진 |\n| 공종별 기술자 | 해당 공종 시공 | 주소·출입 방법·작업 범위·자재 위치·주의사항 | 완료 사진, 이상 보고 |\n| 자재 거래처 | 견적·발주·배송 | 품번·수량·배송일·반입 조건 | 발주·배송 |\n| 관리사무소 | 동의·신고 확인, 공용부 관리 | 공사 기간·범위·엘리베이터 일정 | 동의서·신청서 |\n| 고객 | 결정·확인·점검·결제 | 오늘 진행, 결정할 것, 변경 사항 | 선택·점검 의견 |\n| 이웃 세대 | 소음 공사 인지 | 공사 기간·시간 | 안내문 |\n| 집보다 운영자 | 업체 확인·신고·표본 검수(D-011·D-068) | 업체 확인 근거, 신고 내용 | 운영 기록 |\n\n### 구매자와 사용자의 차이\n\n- 구매자: 대표. 시간 절감, 고객 신뢰, 새 상담 유입, 하자 분쟁 예방\n- 현장 사용자: 대표와 기술자. 지금 할 일, 최소 입력\n- 고객: 앱 설치 없이 진행 확인(D-021), 결정할 것과 변경 사항\n- **제품 요건**: 한 현장 데이터를 공유하되 역할별 정보량·입력 방식·공개 범위를 다르게 설계\n\n---\n\n## 7. 도구 간·단계 간 인계 플로우\n\n쉘터 문서의 기관 간 이송(Transfer In/Out)에 해당하는 것은 현장대장에서 **도구 간 이동**과 **상담에서 현장으로의 이동**이다.\n\n### 데이터 단절 지점 [가설]\n\n- 상담 대화·방문 사진이 계약 후 현장 기록으로 옮겨지지 않음\n- 엑셀 견적과 실제 계약 금액·범위가 달라짐\n- 기술자 완료 보고가 메신저에만 남음\n- 준공 후 자재 정보가 고객에게 전달되지 않음\n- 시공사례 등록 때 사진을 다시 고름\n\n### 현장대장 기회\n\n- 상담 성사 후 현장 연결(D-066) 시 방문 기록·사진을 함께 넘김\n- 공정 사진에서 사례 초안 사진 후보 제시\n- 인계 묶음의 누락 항목 알림\n\n---\n\n## 8. 특수 흐름: 행위허가·신고 대상 공사\n\n쉘터 문서가 크로스보더 구조를 일반 흐름과 분리한 것처럼, 구조 변경이 포함된 공사는 별도 흐름으로 본다.\n\n### 일반 공사와 다른 추가 단계\n\n- 비내력벽 철거, 대수선, 증축·개축, 시설 철거는 시장·군수·구청장의 허가 또는 신고 대상 [확인]\n- 발코니 확장 등 구조·방화 관련 공사의 세부 요건은 별도 확인 필요 [미확인]\n- 허가·신고 완료 전 착공 불가\n\n### 특수 병목 [가설]\n\n- 서류 준비 기간이 공정표에 반영되지 않음\n- 고객이 필요성을 모름\n\n**→ 함의**: 인터뷰 증거를 `일반 세대 내부 공사`와 `허가·신고 대상 공사`로 분리 기록한다.\n\n---\n\n## 9. 주요 병목 우선순위 [가설]\n\n| 우선순위 | 병목 | 발생 단계 | 영향 | 현장대장 검증 가설 |\n| --- | --- | --- | --- | --- |\n| 1 | 현장별 막힌 일·다음 행동이 대표 머릿속에만 있음 | 착공 준비~준공 | 공정 지연, 고객 불신 | 현장별 막힌 이유·기한 보드 |\n| 2 | 기술자 완료·이상 보고 누락 | 시공 | 문제 발견 지연, 재확인 연락 | 링크 기반 완료 사진·이상 보고 |\n| 3 | 고객 결정·착공 선행조건 대기 | 착공 준비 | 발주·공정 밀림 | 고객 결정 목록과 기한 공유 |\n| 4 | 고객의 반복 진행 문의 | 시공 | 대표 시간 소모 | 진행 공유 링크와 변경 알림 |\n| 5 | 계약 후 변경 공사 기록 부재 | 시공 | 분쟁 | 변경 합의 기록 |\n| 6 | 준공 보수 목록 관리 | 준공 | 잔금·인계 지연 | 보수 목록 체크 |\n| 7 | 하자보수 이력 단절 | 사후 | 분쟁, 신뢰 하락 | 하자보수를 원래 현장에 연결 |\n| 8 | 사례 등록 재작업 | 사후 | 공개 사례 부족 | 공정 사진에서 사례 초안 |\n| 9 | 도구 간 중복 입력 | 전 단계 | 시간·오류 | 상담→현장 연결 시 자료 이관 |\n| 10 | 허가·신고 서류 | 착공 준비 | 착공 지연 | 특수 흐름 체크리스트 |\n\n### 먼저 검증할 병목\n\n10개 중 첫 업체 인터뷰에서 **1·2·3번**을 우선 확인한다. 셋 다 현재 구현에 없고, F-M2-WORKSPACE 설계 전에 바꾸는 비용이 가장 적으며, 개선 폭을 연락 횟수·대기일로 셀 수 있다.\n\n- **병목 1**: 진행 중인 현장 하나의 막힌 일을 대표가 어디서 확인하는지 직접 세어본다\n- **병목 2**: 최근 1주일간 기술자에게 완료 여부를 다시 물어본 건수와 채널\n- **병목 3**: 착공이 밀린 가장 최근 사례에서 마지막까지 걸린 조건\n\n4~10번은 관찰 결과로 우선순위를 다시 정한다.\n\n---\n\n## 10. 현장대장 제품 요구사항으로의 변환 — 제안\n\n### Core Practice\n\n1. **공사 대상과 공사 사건 분리**: 같은 집의 재시공·하자보수를 이력으로 연결\n2. **병렬 상태축**: 공정·단지 절차·자재·고객 결정·인계를 따로 관리\n3. **다음 행동 중심 운영**: 현장별 다음 행동, 기한, 막힌 이유\n4. **현장 입력 최소화**: 정상 공정 일괄 완료, 예외만 상세 입력\n5. **원본·변경 이력 보존**: 견적·공정·변경 합의의 변경자·시각(현재 설계의 이벤트 기록 원칙과 같음)\n\n### Peripheral Practice\n\n- 기술자 링크 입력 방식(D-028과 함께 결정)\n- 사진 분류·사례 설명 초안\n- 관리사무소 신청서 양식 생성\n\n### 1차 제품 가설\n\n| 가설 | 최소 기능 | 성공 지표 | 관련 결정 |\n| --- | --- | --- | --- |\n| 현장 점검 보드 | 현장별 막힌 이유·다음 행동·기한 | 대표의 재확인 연락 수, 지연 일수 | 신규 결정 필요 |\n| 착공 준비 체크리스트 | 단지 절차·자재·고객 결정·기술자 일정 | 착공 지연 건수 | 신규 결정 필요 |\n| 고객 결정 공유 | 결정할 항목과 기한을 공유 링크에 표시 | 결정 대기 일수, 고객 문의 수 | D-021 확장 |\n| 기술자 링크 보고 | 완료 사진·이상 보고 | 보고 누락, 재확인 연락 | D-028 충돌 여부 결정 |\n| 준공 인계 묶음 | 자재·보증·관리 방법·보수 목록 | 인계 누락, 하자 문의 대응 시간 | 신규 결정 필요 |\n| 하자보수 연결 | 원래 현장에 하자 사건 추가 | 하자 처리 기간 | D-044·D-047 근거 |\n\n---\n\n## 11. 첫 업체 인터뷰 관찰 프레임\n\n### 화면공유 중 기록할 표\n\n| 시각 | 업무 사건 | 역할 | 사용 도구 | 입력 데이터 | 다음 사람 | 대기·오류·중복 | 공통/특수 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 예시 | 욕실 타일 색 확정 요청 | 대표 | 메신저+사진첩 | 샘플 사진 3장 | 고객 | 이틀 무응답, 발주 지연 | 공통 |\n\n### 반드시 확인할 실제 사례\n\n1. 가장 최근 끝난 현장 하나의 첫 문의부터 준공까지 전체 타임라인\n2. 각 단계에서 막혔던 일과 풀린 방법\n3. 대표·기술자·고객·관리사무소 사이의 인계 순간\n4. 같은 정보를 두 번 이상 입력한 장면\n5. 최신 정보가 어디 있는지 다시 확인한 장면\n6. 기술자에게 완료 여부를 다시 물어본 최근 사례\n7. 고객 결정·자재·절차 때문에 공정이 밀린 사례\n8. 계약 후 변경 공사를 합의하고 기록한 방법\n9. 준공 후 하자보수 대응 사례\n10. 전체 리모델링에만 있는 업무\n\n### 정량 측정\n\n- 현장 하나당 사용 도구 수\n- 데이터 재입력 횟수\n- 사람 간 인계 횟수\n- 고객의 진행 문의 횟수\n- 기술자 재확인 연락 수\n- 계약부터 착공까지 일수와 그중 대기 일수\n- 준공 보수 목록 건수와 처리 일수\n- 하자보수 요청 건수\n\n---\n\n## 12. 업체 인터뷰 질문\n\n### 현재 업무 재현\n\n- 가장 최근 끝난 현장 하나를 골라 첫 문의부터 준공까지 화면으로 재현 요청\n- 첫 기록은 어디에 남기는지\n- 진행 중인 현장들의 상태를 아침에 어디서 확인하는지\n- 막힌 일을 어떻게 기억하고 누구에게 알리는지\n\n### 협력 기술자\n\n- 공종별 기술자를 어떻게 섭외하고 일정을 잡는지\n- 완료 보고를 어떤 방식으로 받는지\n- 일정이 밀리면 누구에게 몇 번 연락하는지\n- 기술자가 앱이나 링크를 쓸 의향이 있는지\n\n### 고객\n\n- 고객이 진행 상황을 얼마나 자주 묻는지\n- 고객에게 결정을 요청하는 항목과 기한을 어떻게 전달하는지\n- 변경 공사 합의를 어떻게 남기는지\n- 준공 후 무엇을 넘겨주는지, 하자 요청은 어떻게 들어오는지\n\n### 전환·지불의향\n\n- 가장 없애고 싶은 반복 업무\n- 지금 쓰는 도구를 유지하면서 추가로 쓸 수 있는 업무\n- 한 달에 얼마의 시간 절감이나 분쟁 감소가 있으면 돈을 낼지(D-061 구독 정책 미정의 근거)\n- 새 상담 유입(집보다)과 현장 관리 중 어느 쪽에 돈을 낼지\n- 고객 사진·주소 공유에 대한 우려\n\n---\n\n## 13. 추가 현장 검증 계획\n\n| 우선순위 | 검증 | 방법 | 완료 기준 |\n| --- | --- | --- | --- |\n| P0 | 진행 중인 현장 하루 | 대표 동행 또는 화면공유 관찰 | 역할·도구·인계·대기 타임라인 |\n| P0 | 끝난 현장 전체 재현 | 업체 3곳, 유형 분리 | 현장당 연락·재입력·대기 일수 |\n| P0 | 현재 도구 | 메신저·엑셀·사진첩 사용 방식 확인 | 병렬 상태를 어디에 두는지 비교 |\n| P1 | 단지 절차 | 서울 단지 관리사무소 3곳 | 동의·신고·보양 요구 비교 |\n| P1 | 고객 관점 | 최근 공사 고객 5명 | 불안·문의·결정 지연 요인 |\n| P1 | 하자보수 | 하자 사례 10건 리뷰 | 초기 신호·대응·결과 분류 |\n| P2 | 사진 재사용 | 공정 사진과 사례 사진 비교 | 재사용률, 재촬영 필요 여부 |\n\n---\n\n## 14. 조사 방법 및 근거 수준\n\n### 주요 근거원\n\n- 법령·공공기관: 공동주택관리법 시행령(찾기쉬운 생활법령정보), 건설산업기본법 시행령 하자담보책임기간, 공정거래위원회 표준계약서, 한국소비자원 피해구제 자료\n- 현장대장 설계 기록: 개발 기준 D-001~D-097, 데이터 구조 제안, 현재 API 스키마\n- 형식: Petnow 쉘터 업무 플로우 리서치의 목차·근거 표기·관찰 프레임\n\n### 근거 수준\n\n| 표기 | 의미 | 쉘터 문서 대응 |\n| --- | --- | --- |\n| [확인] | 법령·공공기관 자료로 뒷받침 | Strong |\n| [종합] | 복수 자료와 현재 설계를 종합한 판단 | Moderate |\n| [가설] | 현장대장 제품 관점의 초기 가설 | Emerging |\n| [미확인] | 공개자료로 알 수 없음 | Unknown |\n\n### 해석 원칙\n\n- 업계 통념은 [종합] 이상으로 올리지 않는다\n- 현장대장 결정(D-ID)과 이 문서의 제안을 섞지 않는다\n- 발생률·소요시간·지불의향은 관찰 전까지 [미확인]\n\n---\n\n## 15. 주요 출처\n\n- 찾기쉬운 생활법령정보, 「아파트 구조 변경 공사 > 인테리어 공사」: https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&csmSeq=1222&ccfNo=2&cciNo=1&cnpClsNo=1\n- 찾기쉬운 생활법령정보, 「아파트 입주 전 내부 인테리어 공사, 구청에 신고해야 하나요?」: https://easylaw.go.kr/CSP/EasyLawInfoR.laf?csmSeq=1222&easySeq=1641\n- 국가법령정보센터, 건설산업기본법 시행령 [별표 4] 건설공사의 종류별 하자담보책임기간: https://www.law.go.kr/LSW/lsLawLinkInfo.do?lsJoLnkSeq=900043676\n- 한국소비자원, 인테리어 관련 소비자 피해구제 정보(공공데이터포털): https://www.data.go.kr/data/15113754/fileData.do\n- 매거진한경, 「늘어나는 인테리어 부실 공사 피해 어떻게 미리 막나」(한국소비자원 자료 인용): https://magazine.hankyung.com/business/article/202212071592b\n- kicc.or.kr 「면허등록 안내」(실내건축공사업 등록 기준): https://kicc.or.kr/license\n- 불교방송, 「홈 인테리어 소비자 피해 증가…계약내용 꼼꼼히 살펴야」(표준계약서 권장): https://news.bbsi.co.kr/news/articleView.html?idxno=3093636\n\n---\n\n## 16. 분석 한계와 최종 판단\n\n### 분석 한계\n\n- 실제 업체 관찰 없이 법령·공공자료·현재 설계 기록만으로 작성했다. 기존 HJOS에도 실사용자·실데이터가 없었다(D-097)\n- 업무 흐름과 병목은 업계 통념을 정리한 가설이며 업체별 편차가 크다\n- 이웃 동의·엘리베이터 보양 등 단지 절차는 관리규약마다 다르다\n- 소비자원 통계는 2018~2021년 피해구제 접수 기준이며 전체 공사의 하자율이 아니다\n\n### 최종 판단\n\n- **[종합]** 현장 운영의 최소 단위는 공정표가 아니라 `현장 하나의 상태 변화와 사람 간 인계`다.\n- **[종합]** 공정·단지 절차·자재·고객 결정·인계는 서로 다른 속도로 움직이므로 독립 상태축과 이벤트 이력이 필요하다. 현재 구현은 공정과 사례 공개만 이 구조를 갖췄다.\n- **[가설]** 현장대장의 가장 유력한 진입점은 현장별 막힌 일·다음 행동·기한을 보여주는 대표용 점검 보드다.\n- **[가설]** 두 번째 진입점은 고객 결정 목록과 준공 인계 묶음을 공유 링크로 넘기는 것이다.\n- **[확인]** 하자보수 미이행·지연이 인테리어 피해구제 1위 유형이므로, 하자보수 이력은 신뢰 지표의 근거로 쓸 가치가 있다.\n- **[미확인]** 어떤 업무가 구독료를 낼 가치를 만드는지는 공개자료로 확인할 수 없다. 업체 관찰에서 시간·연락 횟수·대기일을 측정해야 한다.\n";

el.querySelectorAll('a[href$=".md"]').forEach(a=>{a.removeAttribute('href');a.style.textDecoration='none';});
const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const nodes=[];
while(walker.nextNode()){const n=walker.currentNode;if(/\[(확인|종합|가설|미확인)\]/.test(n.nodeValue)&&!n.parentNode.closest('pre,code'))nodes.push(n);}
nodes.forEach(n=>{const f=document.createElement('span');f.innerHTML=n.nodeValue.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\[(확인|종합|가설|미확인)\]/g,'<span class="ev ev-$1">$1</span>');n.replaceWith(...f.childNodes);});
const list=document.getElementById('toclist');const heads=[...el.querySelectorAll('h2')];
heads.forEach((h,i)=>{h.id='s'+i;const li=document.createElement('li');const a=document.createElement('a');a.href='#s'+i;a.textContent=h.textContent;li.appendChild(a);list.appendChild(li);});
const links=[...list.querySelectorAll('a')];
function spy(){let cur=0;heads.forEach((h,i)=>{if(h.getBoundingClientRect().top<120)cur=i;});links.forEach((a,i)=>a.classList.toggle('on',i===cur));}
addEventListener('scroll',spy,{passive:true});spy();
const toc=document.getElementById('toc'),menu=document.getElementById('menu');
menu.addEventListener('click',()=>{const o=toc.classList.toggle('open');menu.setAttribute('aria-expanded',o);menu.textContent=o?'목차 닫기':'목차 보기';});
list.addEventListener('click',e=>{if(e.target.tagName==='A'&&innerWidth<=960){toc.classList.remove('open');menu.setAttribute('aria-expanded','false');menu.textContent='목차 보기';}});
</script>

</body>
</html>
